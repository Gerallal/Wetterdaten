<!DOCTYPE html>
<html lang="de">
<head>
   <meta charset="UTF-8">
   <title>Belegarbeit</title>
   <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
   <link rel="stylesheet" href="wetterdaten.css" type="text/css">
</head>
<body>

   <div class="row">
      <div id="myDiv" class="chart"></div>
      <div id="myDiv2" class="chart"></div>
   </div>

   <div id="dropdown-container">
      <select id="dropdown" onchange="updateMapAndChart(this.value)">
         <option value="sd">Sonnenscheindauer</option>
         <option value="tm">Lufttemperatur</option>
         <option value="rr">Niederschlag</option>
      </select>
   </div>

   <div id="slider-container">
      <input type="range" id="yearSlider" min="1991" max="2024" value="2024" oninput="updateYear(this.value)">
      <span id="yearLabel"></span>
   </div>

   <script>
   let currentAttribute = 'sd'; 
   let currentYear = 2024; 

   const attributeFilePaths = {
      sd: "data/regional_averages_sd_year.txt",
      tm: "data/regional_averages_tm_year.txt",
      rr: "data/regional_averages_rr_year.txt"
   };

   const colorScales = {
      sd: 'YlOrRd',   // Sonnenscheindauer
      tm: 'RdBu',     // Lufttemperatur
      rr: 'YlGnBu'    // Niederschlag
   };

   function showMap() {
      const filePath = attributeFilePaths[currentAttribute];

      Plotly.d3.text(filePath, function(err, text) {
         if (err) {
            console.error("Fehler beim Laden der Datei:", filePath);
            return;
         }

         const lines = text.trim().split("\n");
         const headers = lines[1].split(";").map(h => h.trim());
         const indexDeutschland = headers.indexOf("Deutschland");

         const stateValues = {};
         const germanStates = [];

         for (let i = 2; i < lines.length; i++) {
            const parts = lines[i].split(";");
            const yearData = parts[0].trim();
            if (yearData == currentYear) {
               for (let j = 1; j < headers.length; j++) {
                  const state = headers[j];
                  if (!germanStates.includes(state)) germanStates.push(state);
                  const val = parseFloat(parts[j].replace(",", "."));
                  if (!isNaN(val)) {
                     if (!stateValues[state]) stateValues[state] = {};
                     stateValues[state][yearData] = val;
                  }
               }
            }
         }

         Plotly.d3.json("data/1_sehr_hoch.geo.json", function(err, geojson) {
            if (err) {
               console.error("Fehler beim Laden der GeoJSON-Datei");
               return;
            }

            const values = germanStates.map(state => 
               (stateValues[state] && stateValues[state][currentYear] !== undefined) ? stateValues[state][currentYear] : null
            );

            const validValues = values.filter(v => v !== null);

            let zmin = Math.min(...validValues);
            let zmax = Math.max(...validValues);
            let reversescale = true;

            if (currentAttribute === 'tm') {
               const meanVal = validValues.reduce((a,b) => a+b, 0) / validValues.length;
               const absMax = Math.max(...validValues.map(v => Math.abs(v - meanVal)));
               zmin = meanVal - absMax;
               zmax = meanVal + absMax;
            }

            const trace = {
               type: 'choropleth',
               locationmode: 'geojson-id',
               geojson: geojson,
               locations: germanStates,
               z: values,
               colorscale: colorScales[currentAttribute],
               marker: { line: { width: 1, color: 'black' } },
               featureidkey: 'properties.name',
               text: germanStates.map(state => {
                  const val = stateValues[state] && stateValues[state][currentYear];
                  return val !== undefined ? 
                     `Wert: ${val} ${currentAttribute === 'sd' ? 'Stunden' : (currentAttribute === 'tm' ? '°C' : 'mm')}` : 
                     "Daten fehlen";
               }),
               hoverinfo: 'location+z+text',
               zmin: zmin,
               zmax: zmax,
               colorbar: {
                  title: currentAttribute === 'sd' ? 'Stunden' : (currentAttribute === 'tm' ? '°C' : 'mm'),
                  outlinewidth: 0
               }
            };

            // Bedingtes Setzen von reversescale:
            if (colorScales[currentAttribute] !== 'RdBu') {
               trace.reversescale = true;
            } else {
               trace.reversescale = false;
            }

            const data = [trace];

            const layout = {
               geo: {
                  scope: 'europe',
                  projection: { type: 'mercator' },
                  fitbounds: "locations",
                  visible: true,
                  bgcolor: 'white'
               },
               margin: { t: 0, b: 0 }
            };

            Plotly.newPlot("myDiv", data, layout, {displayModeBar: false});
         });
      });
   }

   function showLineChart() {
      const filePath = attributeFilePaths[currentAttribute];

      Plotly.d3.text(filePath, function(err, text) {
         if (err) {
            console.error("Fehler beim Laden der Datei:", filePath);
            return;
         }

         const lines = text.trim().split("\n");
         const headers = lines[1].split(";").map(h => h.trim());
         const indexDeutschland = headers.indexOf("Deutschland");

         const x = [], y = [];
         const highlightedX = [], highlightedY = [];

         for (let i = 2; i < lines.length; i++) {
            const parts = lines[i].split(";");
            const yearData = parts[0].trim();

            if (yearData == currentYear) {
               const val = parseFloat(parts[indexDeutschland].replace(",", "."));
               if (!isNaN(val)) {
                  highlightedX.push(yearData);
                  highlightedY.push(val);
               }
            }


            if (yearData >= 1991 && yearData <= 2024) {
               const val = parseFloat(parts[indexDeutschland].replace(",", "."));
               if (!isNaN(val)) {
                  x.push(yearData);
                  y.push(val);
               }
            }
         }

         const trace = {
            x: x,
            y: y,
            type: 'scatter',
            mode: 'lines+markers',
            line: { color: '#cccccc' },
            marker: { size: 12, color: '#cccccc' },
            name: `${currentAttribute === 'sd' ? 'Sonnenscheindauer' : (currentAttribute === 'tm' ? 'Lufttemperatur' : 'Niederschlag')}`
         };

         const highlightedTrace = {
            x: highlightedX,
            y: highlightedY,
            type: 'scatter',
            mode: 'markers',
            marker: { size: 12, color: currentAttribute === 'sd' ? 'orange' : (currentAttribute === 'tm' ? 'blue' : 'green') },
            name: `${currentAttribute === 'sd' ? 'Sonnenscheindauer' : (currentAttribute === 'tm' ? 'Lufttemperatur' : 'Niederschlag')} (Jahr ${currentYear})`
         };

         const layout = {
            title: `${currentAttribute === 'sd' ? 'Sonnenscheindauer' : (currentAttribute === 'tm' ? 'Lufttemperatur' : 'Niederschlag')} im Jahr ${currentYear}`,
            xaxis: { title: "Jahre" },
            yaxis: { title: currentAttribute === 'sd' ? 'Stunden' : (currentAttribute === 'tm' ? '°C' : 'mm') },
            margin: { t: 40, l: 50, r: 30, b: 50 }
         };

         Plotly.newPlot("myDiv2", [trace, highlightedTrace], layout, {displayModeBar: false});
      });
   }

   function updateMapAndChart(value) {
      currentAttribute = value;
      showMap();
      showLineChart();
   }

   function updateYear(year) {
      currentYear = year;
      document.getElementById("yearLabel").textContent = "Jahr: " + year;
      showMap();
      showLineChart();
   }

   function debounce(func, delay) {
      let timeout;
      return function (...args) {
         clearTimeout(timeout);
         timeout = setTimeout(() => func.apply(this, args), delay);
      };
   }


   const debouncedUpdate = debounce(function () {
      const year = document.getElementById("yearSlider").value;
      updateYear(year);
      updateMapAndChart(document.getElementById("dropdown").value);
   }, 300); // 300 ms Wartezeit nach letztem Input

   document.getElementById("yearSlider").addEventListener("input", debouncedUpdate);


   // Initial
   document.getElementById("yearLabel").textContent = "Jahr: " + currentYear;
   showMap();
   showLineChart();

   </script>

</body>
</html>
