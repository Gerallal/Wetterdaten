<!DOCTYPE html>
<html lang="de">
<head>
   <meta charset="UTF-8">
   <title>Belegarbeit</title>
   <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
   <link rel="stylesheet" href="wetterdaten.css" type="text/css">
</head>
<body>

   <div class="row">
      <div id="myDiv" class="chart"></div>
      <div id="myDiv2" class="chart"></div>
   </div>

   <div id="dropdown-container">
      <select id="dropdown" onchange="updateMapAndChart(this.value)">
         <option value="sd">Sonnenscheindauer</option>
         <option value="tm">Lufttemperatur</option>
         <option value="rr">Niederschlag</option>
      </select>
   </div>

   <div id="slider-container">
      <input type="range" id="yearSlider" min="1991" max="2024" value="2024" oninput="updateYear(this.value)">
      <span id="yearLabel"></span>
   </div>

   <script>
   let currentAttribute = 'sd'; // Standardmäßig Sonnenscheindauer
   let currentYear = 2024; // Standardmäßig 2024

   const attributeFilePaths = {
      sd: "data/regional_averages_sd_year.txt", // Sonnenscheindauer
      tm: "data/regional_averages_tm_year.txt", // Lufttemperatur
      rr: "data/regional_averages_rr_year.txt" // Niederschlag
   };

   const colorScales = {
      sd: 'YlOrRd',   // Sonnenscheindauer
      tm: 'RdBu',     // Lufttemperatur
      rr: 'YlGnBu'    // Niederschlag
   };

   const stateNameMapping = {
      "Baden-Wuerttemberg": "Baden-Württemberg",
      "Bayern": "Bayern",
      "Brandenburg/Berlin": "Berlin",
      "Brandenburg": "Brandenburg", 
      "Hessen": "Hessen",
      "Mecklenburg-Vorpommern": "Mecklenburg-Vorpommern",
      "Nordrhein-Westfalen": "Nordrhein-Westfalen",
      "Rheinland-Pfalz": "Rheinland-Pfalz",
      "Saarland": "Saarland",
      "Sachsen": "Sachsen",
      "Sachsen-Anhalt": "Sachsen-Anhalt",
      "Schleswig-Holstein": "Schleswig-Holstein",
      "Thueringen": "Thüringen"
   };

   // Zusätzliches Mapping für zusammengefasste Bundesländer
   const specialStateMapping = {
      "Niedersachsen/Hamburg/Bremen": ["Niedersachsen", "Hamburg", "Bremen"]
   };

   function showMap() {
      // Laden der entsprechenden Attributdatei, je nach Attributauswahl
      const filePath = attributeFilePaths[currentAttribute];

      // Laden der Textdatei mit den Attributdaten
      Plotly.d3.text(filePath, function(err, text) {
         // Fehlerbehebung, falls Datei nicht geladen wird
         if (err) {
            return;
         }

         // Extrahieren der Daten aus der Textdatei
         const lines = text.trim().split("\n");
         const headers = lines[1].split(";").map(h => h.trim());
         const indexDeutschland = headers.indexOf("Deutschland");

         const stateValues = {};
         const germanStates = [];

         // Extrahieren der Werte für das aktuelle Jahr, was über den Slider ausgewählt wird
         for (let i = 2; i < lines.length; i++) {
            const parts = lines[i].split(";");
            const yearData = parts[0].trim();
            // Prüfen, ob das Jahr mit dem aktuellen Jahr übereinstimmt
            if (yearData == currentYear) {
               // Extrahieren der Werte für Deutschland und die Bundesländer
               for (let j = 1; j < headers.length; j++) {
                  const state = headers[j];
                  if (specialStateMapping[state]) {
                     // Wenn es ein kombiniertes Bundesland ist
                     const val = parseFloat(parts[j].replace(",", "."));
                     if (!isNaN(val)) {
                        // Wert auf alle zugehörigen Bundesländer aufteilen
                        specialStateMapping[state].forEach(subState => {
                           if (!stateValues[subState]) stateValues[subState] = {};
                           stateValues[subState][yearData] = val;
                        });
                     }
                  } else {
                     const mappedState = stateNameMapping[state] || state; // Mappen des Bundeslandnamens
                     // Prüfen, ob der Bundeslandname gültig ist
                     if (!germanStates.includes(mappedState)) germanStates.push(state);
                     const val = parseFloat(parts[j].replace(",", "."));
                     // Prüfen, ob der Wert eine gültige Zahl ist
                     if (!isNaN(val)) {
                        if (!stateValues[state]) stateValues[state] = {};
                        stateValues[state][yearData] = val;
                     }
                  }
               }
            }
         }

         // Laden der GeoJSON-Datei, nur für Deutschland
         // Quelle: https://github.com/isellsoap/deutschlandGeoJSON/blob/main/2_bundeslaender/1_sehr_hoch.geo.json 
         Plotly.d3.json("data/1_sehr_hoch.geo.json", function(err, geojson) {
            // Fehlerbehebung
            if (err) {
               return;
            }

            // Extrahieren der Werte für die Bundesländer
            const values = germanStates.map(state => 
               (stateValues[state] && stateValues[state][currentYear] !== undefined) ? stateValues[state][currentYear] : null
            );

            // Überprüfen, ob Werte vorhanden sind
            const validValues = values.filter(v => v !== null);

            const fixedColorRanges = {
               sd: { zmin: 1400, zmax: 2200 }, // Stunden
               tm: { zmin: 7, zmax: 11 },      // °C
               rr: { zmin: 400, zmax: 1100 }   // mm
            };

            const { zmin, zmax } = fixedColorRanges[currentAttribute]; // Minimale und maximale Werte für die Legende
            let reversescale = true; // Attribut-Colorscales umkehren

            // Erstellen des Trace-Objekts für die Karte
            const trace = {
               type: 'choropleth',
               locationmode: 'geojson-id',
               geojson: geojson,
               locations: geojson.features.map(f => f.properties.name), // Verwende die Namen aus der GeoJSON
               z: geojson.features.map(f => {
                  const geoName = f.properties.name;
                  // Finde den Original-Namen aus den Daten
                  const origName = Object.keys(stateNameMapping).find(
                     key => stateNameMapping[key] === geoName
                  ) || geoName;
                  return stateValues[origName] && stateValues[origName][currentYear] || null;
               }),
               colorscale: colorScales[currentAttribute], // Farben je nach Attribut
               marker: { line: { width: 1, color: 'black' } },
               featureidkey: 'properties.name',
               // Tooltip-Text für Hover-Effekte
               text: geojson.features.map(f => {
                  const geoName = f.properties.name;
                  // Finde den Original-Namen aus den Daten
                  const origName = Object.keys(stateNameMapping).find(
                     key => stateNameMapping[key] === geoName
                  ) || geoName;
                  const val = stateValues[origName] && stateValues[origName][currentYear];
                  return val !== undefined ? 
                     `${geoName}: ${val} ${currentAttribute === 'sd' ? 'Stunden' : (currentAttribute === 'tm' ? '°C' : 'mm')}` : 
                     `${geoName}: Daten fehlen`;
               }),
               hoverinfo: 'text',
               zmin: zmin,
               zmax: zmax,
               colorbar: {
                  title: currentAttribute === 'sd' ? 'Stunden' : (currentAttribute === 'tm' ? '°C' : 'mm'),
                  outlinewidth: 0
               },
            };

            // Colorscales reversen, außer bei Lufttemperatur
            if (colorScales[currentAttribute] !== 'RdBu') {
               trace.reversescale = true;
            } else {
               trace.reversescale = false;
            }

            // Layout für die Karte
            const layout = {
               geo: {
                  scope: 'europe',
                  projection: { type: 'mercator' },
                  fitbounds: "locations",
                  visible: true,
                  bgcolor: 'white',
                  showland: false,
                  showframe: false,
                  showcountries: false,
                  resolution: 50,
                  lonaxis: { range: [5, 16] }, // Längengradbereich für Deutschland
                  lataxis: { range: [47, 55] } // Breitengradbereich für Deutschland
               },
               margin: { t: 0, b: 0 },
               dragmode: false,
            };

            // Erstellen der Karte in myDiv mit Plotly
            Plotly.newPlot("myDiv", [trace], layout);
         });
      });
   }

   function showLineChart() {

      const filePath = attributeFilePaths[currentAttribute];

      Plotly.d3.text(filePath, function(err, text) {
         if (err) {
            console.error("Fehler:", filePath);
            return;
         }

         // Extrahieren der Daten aus der Textdatei
         const lines = text.trim().split("\n");
         const headers = lines[1].split(";").map(h => h.trim());
         const stateIndices = headers.map((name, index) => ({ name, index })).filter(obj => obj.name !== "Deutschland" && obj.index > 0);

         const x = [], y = [];
         const highlightedX = [], highlightedY = []; // Nur das Jahr wird gehighlighted, welches ausgewählt ist

         // Extrahieren der Werte für das aktuelle Jahr, was über den Slider ausgewählt wird
         for (let i = 2; i < lines.length; i++) {
            const parts = lines[i].split(";");
            const yearData = parts[0].trim();
            const yearNumber = parseInt(yearData); // Nur Jahre zwischen 1991 und 2024

            // Nur Jahre zwischen 1991 und 2024
            if (yearNumber >= 1991 && yearNumber <= 2024) {
               // Nur das aktuelle Jahr
               const values = [];

               // Extrahieren der Werte für die Bundesländer
               for(let s of stateIndices) {
                     const val = parseFloat(parts[s.index].replace(",", "."));
                     if (!isNaN(val)) {
                        values.push(val);
                     }
                  }

                  // Nur wenn Werte für das Jahr vorhanden sind, wird es in x und y gepusht eingefügt
                  if(values.length > 0) {
                     const avg = values.reduce((a,b) => a + b, 0) / values.length;
                     x.push(yearData); // Jahr
                     y.push(avg); // Durchschnittswert

                     if (parseInt(yearData) == currentYear) {
                        highlightedX.push(yearData); // Jahr für Highlight
                        highlightedY.push(avg); // Durchschnittswert für Highlight
                  
                     }
                  } 
            } 
            
  
         }

         const trace = {
            x: x,
            y: y,
            type: 'scatter',
            mode: 'lines+markers',
            line: { color: '#cccccc' },
            marker: { size: 12, color: '#cccccc' },
            name: `${currentAttribute === 'sd' ? 'Sonnenscheindauer' : (currentAttribute === 'tm' ? 'Lufttemperatur' : 'Niederschlag')}`
         };

         const highlightedTrace = {
            x: highlightedX,
            y: highlightedY,
            type: 'scatter',
            mode: 'markers',
            marker: { size: 12, color: currentAttribute === 'sd' ? 'orange' : (currentAttribute === 'tm' ? 'purple' : 'blue') },
            name: `${currentAttribute === 'sd' ? 'Sonnenscheindauer' : (currentAttribute === 'tm' ? 'Lufttemperatur' : 'Niederschlag')} (Jahr ${currentYear})`
         };

         const layout = {
            title: `${currentAttribute === 'sd' ? 'Sonnenscheindauer' : (currentAttribute === 'tm' ? 'Lufttemperatur' : 'Niederschlag')} im Jahr ${currentYear}`,
            xaxis: { title: "Jahre" },
            yaxis: { title: currentAttribute === 'sd' ? 'Stunden' : (currentAttribute === 'tm' ? '°C' : 'mm') },
            margin: { t: 40, l: 50, r: 30, b: 50 }
         };

         Plotly.newPlot("myDiv2", [trace, highlightedTrace], layout, {displayModeBar: false});
      });
   }

   // Anzeige der Karte und des Diagramms
   function updateMapAndChart(value) {
      currentAttribute = value;
      showMap();
      showLineChart();
   }

   // Aktualisierung des Jahreslabels und der Karte/Diagramm bei Verschiebung des Sliders
   function updateYear(year) {
      currentYear = year;
      document.getElementById("yearLabel").textContent = "Jahr: " + year;
      showMap();
      showLineChart();
   }

   // Event-Listener für den Dropdown und den Slider
   document.getElementById("yearSlider").addEventListener("input", function(e) {
      currentYear = e.target.value;
      document.getElementById("yearLabel").textContent = "Jahr: " + currentYear;
      showLineChart(); // Nur Line Chart wird aktualisiert
   });

   document.getElementById("yearSlider").addEventListener("change", function(e) {
      showMap(); // Karte wird erst jetzt aktualisiert
   });

   // Initialisierung der Karte und des Diagramms
   document.getElementById("yearLabel").textContent = "Jahr: " + currentYear;
   showMap();
   showLineChart();

   window.addEventListener("load", function() {
      document.getElementById("yearSlider").value = 2024;
      updateYear(2024);
      updateMapAndChart(document.getElementById("dropdown").value = 'sd');
   });

   </script>

</body>
</html>
