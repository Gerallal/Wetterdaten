<!DOCTYPE html>

<html lang="en">

<head>

   <meta charset="UTF-8">
   <title>Belegarbeit</title>
   <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

</head>

<body>

   <div id="myDiv" style="width:600px;height:400px;"></div>

   <script>

   function makeplot() {
      Plotly.d3.json("\\data\\1_sehr_hoch.geo.json", function(err, geojson){
         const german_states = geojson.features.map(f => f.properties.name);
         const test_values = new Array(german_states.length).fill(1);

      const data = [{
         type: 'choropleth',
         locationmode: 'geojson-id',
         geojson: geojson,
         locations: german_states,
         z: test_values,   
         marker: {line: {width: 1, color: 'black'}},
         featureidkey: 'properties.name',
      }];

      const layout = {
         geo: {
            scope: 'europe',
            projection: {type: 'mercator'},
            fitbounds: "locations",
            visible: true
         },
         margin: {t: 0, b: 0}
      };

      Plotly.newPlot("myDiv", data, layout);

      });
   }

   makeplot();

   </script>
