<!DOCTYPE html>
<html lang="de">
<head>
   <meta charset="UTF-8">
   <title>Belegarbeit</title>
   <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
   <link rel="stylesheet" href="wetterdaten.css" type="text/css">
</head>
<body>

   <div class="row">
      <div id="myDiv" class="chart"></div>
      <div id="myDiv2" class="chart"></div>
   </div>

   <div id="dropdown-container">
      <select id="dropdown" onchange="updateChart(this.value)">
         <option value="sd">Sonnenscheindauer</option>
         <option value="tm">Lufttemperatur</option>
         <option value="rr">Niederschlag</option>
      </select>
   </div>

   <div id="slider-container">
      <input type="range" id="yearSlider" min="1991" max="2024" value="2024" oninput="updateYear(this.value)">
      <span id="yearLabel">Jahr: 2024</span>
   </div>

   

   <script>
   function showMap() {
      Plotly.d3.json("data/1_sehr_hoch.geo.json", function(err, geojson) {
         const german_states = geojson.features.map(f => f.properties.name);
         const test_values = new Array(german_states.length).fill(1);

         const data = [{
            type: 'choropleth',
            locationmode: 'geojson-id',
            geojson: geojson,
            locations: german_states,
            z: test_values,
            marker: { line: { width: 1, color: 'black' } },
            featureidkey: 'properties.name'
         }];

         const layout = {
            geo: {
               scope: 'europe',
               projection: { type: 'mercator' },
               fitbounds: "locations",
               visible: true
            },
            margin: { t: 0, b: 0 }
         };

         Plotly.newPlot("myDiv", data, layout);
      });
   }

   function showLineChart(filePath, divId, color, label, unit) {
      Plotly.d3.text(filePath, function(err, text) {
         const lines = text.trim().split("\n");
         const headers = lines[1].split(";").map(h => h.trim());
         const index = headers.indexOf("Deutschland");

         const x = [], y = [];
         for (let i = 2; i < lines.length; i++) {
            const parts = lines[i].split(";");
            const year = parts[0].trim();

            if (year >= 1991 && year <= 2024) {
               const value = parseFloat(parts[index].replace(",", "."));
               if (!isNaN(value)) {
                  x.push(year);
                  y.push(value);
               }
            }
         }

         const trace = {
            x: x,
            y: y,
            type: 'scatter',
            mode: 'lines+markers',
            line: { color: color },
            marker: { size: 6 },
            name: label
         };

         const layout = {
            title: `${label} (1991–2024)`,
            xaxis: { title: "Jahr" },
            yaxis: { title: unit },
            margin: { t: 40, l: 50, r: 30, b: 50 }
         };

         Plotly.newPlot(divId, [trace], layout);
      });
   }

   function updateChart(value) {
      if (value === "sd") {
         showLineChart("data/regional_averages_sd_year.txt", "myDiv2", "orange", "Sonnenscheindauer", "Stunden");
      } else if (value === "tm") {
         showLineChart("data/regional_averages_tm_year.txt", "myDiv2", "blue", "Lufttemperatur", "°C");
      } else if (value === "rr") {
         showLineChart("data/regional_averages_rr_year.txt", "myDiv2", "green", "Niederschlag", "mm");
      }
   }

   function updateYear(year) {
      document.getElementById("yearLabel").textContent = "Jahr: " + year;
   }

   showMap();
   showLineChart("data/regional_averages_sd_year.txt", "myDiv2", "orange", "Sonnenscheindauer", "Stunden");

   // LineCart und Map sollen nebeneinandern sein
   </script>

</body>
</html>
